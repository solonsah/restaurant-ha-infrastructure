---
name: HA Infrastructure Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ha-validation.yml"
      - ".ansible-lint"
      - ".yamllint"
      - "ansible/**"
      - "inventory/example.ini"
      - "requirements-dev.txt"
      - "requirements.yml"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ha-validation.yml"
      - ".ansible-lint"
      - ".yamllint"
      - "ansible/**"
      - "inventory/example.ini"
      - "requirements-dev.txt"
      - "requirements.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HA infrastructure framework
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Run static validation
        run: bash scripts/validate.sh
