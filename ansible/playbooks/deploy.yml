---
- name: Deploy approved restaurant high-availability changes
  hosts: restaurant_ha
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  pre_tasks:
    - name: Require an explicit restricted host limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
          - ansible_limit not in ["all", "restaurant_ha"]
        fail_msg: >-
          Deployment requires an explicit restricted --limit.
          Start with one approved non-production host.

  roles:
    - role: restaurant_ha
